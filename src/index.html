<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Compare — 目录比对与增量备份</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 图标精灵：所有按钮统一用 16×16 线条图标，颜色跟随 currentColor，不额外加载资源 -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.6 8S4.1 4.2 8 4.2 14.4 8 14.4 8 11.9 11.8 8 11.8 1.6 8 1.6 8Z"/><circle cx="8" cy="8" r="1.9"/></symbol>
  <symbol id="i-filter" viewBox="0 0 16 16"><path d="M2 3.4h12L9.4 8.6v4.6l-2.8 1.2V8.6L2 3.4Z"/></symbol>
  <symbol id="i-expand" viewBox="0 0 16 16"><path d="M4 4.6 8 8.4l4-3.8"/><path d="M4 9.4 8 13.2l4-3.8"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 16 16"><path d="M4 11.4 8 7.6l4 3.8"/><path d="M4 6.6 8 2.8l4 3.8"/></symbol>
  <symbol id="i-hash" viewBox="0 0 16 16"><path d="M5.6 2.4 4.3 13.6M11.7 2.4 10.4 13.6M2.4 6.1h11.2M2 10.1h11.2"/></symbol>
  <symbol id="i-select" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2.6"/><path d="M4.9 8.2 7.1 10.4l4.1-4.6"/></symbol>
  <symbol id="i-clear" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2.6"/><path d="M5.7 5.7l4.6 4.6M10.3 5.7l-4.6 4.6"/></symbol>
  <symbol id="i-preview" viewBox="0 0 16 16"><rect x="3" y="2.6" width="10" height="11.4" rx="2"/><path d="M6 1.9h4v2.2H6z"/><path d="M5.7 7.2h4.6M5.7 10h3.2"/></symbol>
  <symbol id="i-report" viewBox="0 0 16 16"><path d="M8 1.9v7.4"/><path d="M5.3 6.6 8 9.3l2.7-2.7"/><path d="M2.6 11.2v2.9h10.8v-2.9"/></symbol>
  <symbol id="i-backup" viewBox="0 0 16 16"><path d="M1.8 4.3h4.3l1.2 1.7h6.9v8H1.8z"/><path d="M8 7.3v3.7"/><path d="M6.5 9.5 8 11l1.5-1.5"/></symbol>
  <symbol id="i-copyto" viewBox="0 0 16 16"><path d="M2.2 8h7.2"/><path d="M6.7 5.3 9.4 8l-2.7 2.7"/><path d="M12.4 3.4v9.2"/></symbol>
  <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.6 9.4 9.4 6.6"/><path d="M7.8 4.6 8.8 3.6a2.5 2.5 0 0 1 3.6 3.6l-1 1"/><path d="M8.2 11.4l-1 1a2.5 2.5 0 0 1-3.6-3.6l1-1"/></symbol>
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.8 4.3h4.3l1.2 1.7h6.9v8H1.8z"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></symbol>
  <symbol id="i-list" viewBox="0 0 16 16"><path d="M2.6 4.3h10.8M2.6 8h10.8M2.6 11.7h10.8"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13.2 10.3A5.5 5.5 0 0 1 5.9 3.1a5.7 5.7 0 1 0 7.3 7.2Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.2 1.2M11.4 11.4l1.2 1.2M12.6 3.4l-1.2 1.2M4.6 11.4l-1.2 1.2"/></symbol>
  <symbol id="i-min" viewBox="0 0 16 16"><path d="M3.4 8.4h9.2"/></symbol>
  <symbol id="i-max" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.2"/></symbol>
  <symbol id="i-restore" viewBox="0 0 16 16"><rect x="2.8" y="5.2" width="7.6" height="7.6" rx="1.2"/><path d="M5.9 3.4h7.3v7.3"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="M4.3 4.3l7.4 7.4M11.7 4.3l-7.4 7.4"/></symbol>
  <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.1"/><path d="M8 7.2v4.1"/><circle cx="8" cy="4.9" r="0.75" fill="currentColor" stroke="none"/></symbol>
</svg>

<div class="app">

  <!-- 自绘标题栏：系统窗口条已关闭（decorations=false），这里同时是拖拽区 -->
  <div class="titlebar" data-tauri-drag-region>
    <img class="logo" src="icon.png" alt="Easy Compare" width="22" height="22" draggable="false" data-tauri-drag-region>
    <span class="tt" data-tauri-drag-region>Easy Compare</span>
    <span class="tsub" data-tauri-drag-region>轻量化文件备份同步工具</span>
    <div class="right">
      <span class="pill" id="modePill">演示数据</span>
      <span class="pill" id="lastBackupPill" style="display:none"></span>
      <button class="ibtn" id="sessionBtn" title="会话管理" aria-label="会话管理"><svg class="ic"><use href="#i-list"/></svg></button>
      <button class="ibtn" id="themeBtn" title="切换深色 / 浅色" aria-label="切换深浅色">
        <svg class="ic ic-moon"><use href="#i-moon"/></svg>
        <svg class="ic ic-sun"><use href="#i-sun"/></svg>
      </button>
      <span class="wctl" id="winControls">
        <button class="wbtn" id="winMin" title="最小化" aria-label="最小化"><svg class="ic"><use href="#i-min"/></svg></button>
        <button class="wbtn" id="winMax" title="最大化" aria-label="最大化">
          <svg class="ic ic-max"><use href="#i-max"/></svg>
          <svg class="ic ic-restore"><use href="#i-restore"/></svg>
        </button>
        <button class="wbtn close" id="winClose" title="关闭" aria-label="关闭"><svg class="ic"><use href="#i-x"/></svg></button>
      </span>
    </div>
  </div>

  <div class="pathbar">
    <div class="pgroup"><span class="plabel">源</span><input class="pinput mono" id="srcPath" placeholder="选择或粘贴源目录绝对路径" spellcheck="false"><button class="pbtn" id="srcBrowse" title="浏览源目录" aria-label="浏览源目录"><svg class="ic"><use href="#i-folder"/></svg></button></div>
    <div class="pgroup"><span class="plabel">目标</span><input class="pinput mono" id="tgtPath" placeholder="选择或粘贴目标目录绝对路径（如移动硬盘）" spellcheck="false"><button class="pbtn" id="tgtBrowse" title="浏览目标目录" aria-label="浏览目标目录"><svg class="ic"><use href="#i-folder"/></svg></button></div>
    <button class="btn-primary" id="bindBtn" title="绑定并比对：校验路径与卷标识后开始扫描" aria-label="绑定并比对"><svg class="ic"><use href="#i-link"/></svg></button>
  </div>

  <div class="toolbar">
    <select class="chip" id="ruleSel" title="比对依据">
      <option value="quick">大小 + 修改时间</option>
      <option value="hash">SHA-256 精确校验</option>
    </select>
    <button class="chip icon on" id="onlyDiff" role="switch" aria-checked="true" title="只看差异（隐藏已同步项）" aria-label="只看差异"><svg class="ic"><use href="#i-eye"/></svg></button>
    <button class="chip icon" id="filterBtn" title="过滤规则（未启用）" aria-label="过滤规则"><svg class="ic"><use href="#i-filter"/></svg><span class="nbadge" id="filterCount"></span></button>
    <span class="foldgroup" role="group" aria-label="目录折叠">
      <button class="chip icon" id="expandAll" title="展开全部文件夹" aria-label="展开全部"><svg class="ic"><use href="#i-expand"/></svg></button>
      <button class="chip icon" id="collapseAll" title="收起全部文件夹（只保留顶层）" aria-label="收起全部"><svg class="ic"><use href="#i-collapse"/></svg></button>
    </span>
    <span class="sep"></span>
    <select class="chip" id="stateFilter" title="按状态筛选">
      <option value="all">全部状态</option><option value="ok">已同步</option><option value="diff">需更新</option>
      <option value="left">仅源有</option><option value="right">仅目标有</option><option value="conflict">冲突</option>
      <option value="unknown">未比对</option>
    </select>
    <button class="chip icon" id="hashSel" title="校验选中项哈希（SHA-256 精确比对）" aria-label="校验选中项哈希"><svg class="ic"><use href="#i-hash"/></svg></button>
    <button class="chip icon" id="selectDiff" title="全选差异（所有需要写入的项）" aria-label="全选差异"><svg class="ic"><use href="#i-select"/></svg></button>
    <button class="chip icon" id="clearSel" title="清空选择" aria-label="清空选择"><svg class="ic"><use href="#i-clear"/></svg></button>
    <div class="push">
      <input class="search" id="searchInput" placeholder="搜索文件名…" spellcheck="false">
      <span class="hint" id="scanTime">—</span>
    </div>
  </div>

  <div class="scanbar" id="scanbar">
    <span class="spin"></span><span id="scanText">正在扫描…</span>
    <span class="push"><button class="ibtn" id="cancelScanBtn" title="取消扫描" aria-label="取消扫描"><svg class="ic"><use href="#i-x"/></svg></button></span>
  </div>

  <div class="warnbar" id="warnbar"><b>提示</b><span id="warnText"></span><span class="push"><button class="ibtn" id="rebindBtn" title="重新绑定目标卷" aria-label="重新绑定目标卷"><svg class="ic"><use href="#i-link"/></svg></button></span></div>

  <div class="colhead">
    <div><b>源文件夹</b><span class="badge mono" id="srcBadge">—</span><span class="cnt" id="srcCount">— 项</span></div>
    <div class="mid">状态</div>
    <div class="act" title="复制列：把这一行（文件或整个文件夹）复制到目标文件夹；仍需在预演清单确认后才写入" aria-label="复制到目标"><svg class="ic"><use href="#i-copyto"/></svg></div>
    <div><b>目标文件夹</b><span class="badge mono" id="tgtBadge">—</span><span class="cnt" id="tgtCount">— 项</span></div>
  </div>

  <div class="tree" id="tree"></div>

  <div class="statusbar" id="statusbar"></div>

  <div class="actionbar">
    <button class="btn icon" id="dryBtn" title="预演清单（不产生任何写入）" aria-label="预演清单"><svg class="ic"><use href="#i-preview"/></svg></button>
    <span class="blockhint" id="blockHint"></span>
    <div class="push">
      <button class="btn icon" id="reportBtn" title="导出结果报告" aria-label="导出结果报告"><svg class="ic"><use href="#i-report"/></svg></button>
      <button class="btn go icon" id="backupBtn" disabled title="一键备份：把选中的差异写入目标目录" aria-label="一键备份"><svg class="ic"><use href="#i-backup"/></svg></button>
    </div>
  </div>

  <div class="legend" id="legend">
    <button class="lgbtn" id="legendBtn" title="图例说明" aria-label="图例说明" aria-expanded="false"><svg class="ic"><use href="#i-info"/></svg></button>
    <div class="lgbody" id="legendBody">
      <span class="item"><i class="sw" style="background:var(--ok)"></i>已同步 =</span>
      <span class="item"><i class="sw" style="background:var(--diff)"></i>需更新 ≠</span>
      <span class="item"><i class="sw" style="background:var(--left)"></i>仅源有 →</span>
      <span class="item"><i class="sw" style="background:var(--right)"></i>仅目标有 ←</span>
      <span class="item"><i class="sw" style="background:var(--conflict)"></i>冲突 !</span>
      <span class="item"><i class="sw" style="background:var(--unknown)"></i>未比对 ·</span>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-h"><span id="modalTitle">确认备份</span><span class="x" id="modalClose" role="button" tabindex="0">×</span></div>
      <div class="modal-b" id="modalBody"></div>
      <div class="modal-f" id="modalFoot"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
